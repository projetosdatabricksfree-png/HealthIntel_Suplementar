version: 1
produto: Core ANS
regra_cobertura:
  mensal: 36
  trimestral: 12
  anual: 3
  snapshot_vigente: 1
  nao_temporal: 0
endpoints:
  - endpoint: /v1/operadoras
    nome_dataset: cadop_operadora
    schema_origem: api_ans
    tabela_origem: api_operadora
    coluna_temporal: competencia_referencia
    granularidade_temporal: snapshot_vigente
    regra_3_anos: "snapshot vigente; nao exige 36 competencias"
    status_publicacao: disponivel
    exige_backfill: false
    observacao: "Endpoint cadastral vigente tratado como snapshot_vigente."
  - endpoint: /v1/produtos-planos
    nome_dataset: produto_plano
    schema_origem: consumo_ans
    tabela_origem: consumo_produto_plano
    coluna_temporal: competencia
    granularidade_temporal: mensal
    regra_3_anos: "minimo 36 competencias distintas"
    status_publicacao: disponivel
    exige_backfill: false
    observacao: "Backfill concluido com cobertura de 37 competencias (mai 2023 a mai 2026)."
  - endpoint: /v1/historico-planos
    nome_dataset: historico_plano
    schema_origem: consumo_ans
    tabela_origem: consumo_historico_plano
    coluna_temporal: competencia
    granularidade_temporal: mensal
    regra_3_anos: "minimo 36 competencias distintas"
