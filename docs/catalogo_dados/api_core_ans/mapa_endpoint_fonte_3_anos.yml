    exige_backfill: false
    observacao: "Backfill concluido com cobertura de 37 competencias (mai 2023 a mai 2026)."
  - endpoint: /v1/regulatorio
    nome_dataset: regulatorio_operadora
    schema_origem: consumo_ans
    tabela_origem: consumo_regulatorio_operadora_trimestre
    coluna_temporal: trimestre
    granularidade_temporal: trimestral
    regra_3_anos: "minimo 12 trimestres distintos"
    status_publicacao: disponivel
    exige_backfill: false
    observacao: "Fonte oficial de consumo para contrato comercial."
